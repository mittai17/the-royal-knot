# Production stack — import into Dokploy as a "Docker Compose" application.
# Secrets come from Dokploy's Environment tab (see .env.example); nothing here is a real credential.
# Only `frontend` is routed publicly (Traefik via dokploy-network); the browser reaches the API
# through the frontend's /api and /socket.io rewrites, so the backend needs no public domain.
name: royalknot

x-restart: &restart
  restart: unless-stopped

services:
  frontend:
    <<: *restart
    image: royalknot-frontend:local
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal, dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.royalknot.rule=Host(`${APP_DOMAIN:-royalknot.localhost}`)
      - traefik.http.routers.royalknot.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.services.royalknot.loadbalancer.server.port=3000

  backend:
    <<: *restart
    image: royalknot-backend:local
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-royalknot}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-royalknot}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${PUBLIC_URL:-http://royalknot.localhost}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-royalknot}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-royalknot}
      GOTENBERG_URL: http://gotenberg:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@royalknot.local}
      SEED_ON_START: ${SEED_ON_START:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-royalknot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-royalknot}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    <<: *restart
    # MinIO no longer publishes official images, so it is built from source (deploy/minio/Dockerfile).
    build: ./deploy/minio
    image: royalknot-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-royalknot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    networks: [internal]

  gotenberg:
    <<: *restart
    image: gotenberg/gotenberg:8
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 6

  mailpit:
    <<: *restart
    image: axllent/mailpit:latest
    networks: [internal]
    # Inbox UI (8025) is internal-only by default. To expose it, add a Traefik router in Dokploy's
    # Domains tab pointing at mailpit:8025 behind authentication.

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  miniodata:
