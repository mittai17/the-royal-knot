# Service "royalknot-backend": NestJS API only. Image from deploy/scripts/build-images.sh.
# No depends_on: docker-entrypoint.sh waits for postgres (120s) then migrates + seeds.
# Env contract identical to the root docker-compose.yml.
name: royalknot-backend

services:
  backend:
    image: royalknot-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-royalknot}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/royalknot?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${PUBLIC_APP_URL:-http://app.royalknot.localhost}
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://app.royalknot.localhost}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-royalknot}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-royalknot-documents}
      GOTENBERG_URL: http://gotenberg:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@royalknot.local}
      UPI_VPA: ${UPI_VPA:-royalknot@upi}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://auth.royalknot.localhost}/realms/royalknot
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://auth.royalknot.localhost}/realms/royalknot
      KEYCLOAK_REALM: royalknot
      KEYCLOAK_CLIENT_ID: royalknot-web
      KEYCLOAK_CLIENT_SECRET: ${KC_API_CLIENT_SECRET:-royalknot_api_secret_2026}
      HYPERSWITCH_URL: ${HYPERSWITCH_URL:-http://hyperswitch:8080}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_FORCE: ${SEED_FORCE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-RoyalKnot@2026}
    expose: ["4000"]
    networks:
      royalknot-internal: { aliases: [backend, rk-backend] }
      dokploy-network:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  royalknot-internal:
    external: true
  dokploy-network:
    external: true
